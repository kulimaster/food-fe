<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-background"><main class="w-full flex items-center justify-center min-h-screen"><div class="flex flex-col w-full h-full min-h-[calc(100vh-64px)] lg:flex-row bg-surface">
<div class="flex flex-col justify-center w-full p-container-padding lg:w-1/2 lg:p-xl">
<div class="w-full max-w-md mx-auto">
<div class="mb-xl">
<h1 class="text-display-lg font-display-lg text-on-surface mb-sm">Welcome back</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Sign in to continue your nutrition journey.</p>
</div>
<div class="flex flex-col gap-md mb-xl">
<button class="flex items-center justify-center w-full px-lg py-md bg-surface-container-low text-on-surface rounded-lg hover:bg-surface-container transition-colors shadow-sm">
<span class="material-symbols-outlined mr-sm">account_circle</span>
<span class="text-label-md font-label-md">Continue with Google</span>
</button>
<button class="flex items-center justify-center w-full px-lg py-md bg-surface-container-low text-on-surface rounded-lg hover:bg-surface-container transition-colors shadow-sm">
<span class="material-symbols-outlined mr-sm">file_download</span>
<span class="text-label-md font-label-md">Continue with Apple</span>
</button>
</div>
<div class="flex items-center mb-xl">
<div class="flex-grow h-px bg-surface-container-high"></div>
<span class="px-sm text-label-sm font-label-sm text-on-surface-variant uppercase">Or log in with email</span>
<div class="flex-grow h-px bg-surface-container-high"></div>
</div>
<form class="flex flex-col gap-lg">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="email">Email address</label>
<input class="w-full px-md py-md bg-surface-container-lowest text-on-surface rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-shadow placeholder:text-on-surface-variant/50" id="email" placeholder="name@example.com" type="email"/>
</div>
<div>
<div class="flex justify-between mb-xs">
<label class="block text-label-md font-label-md text-on-surface" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full px-md py-md bg-surface-container-lowest text-on-surface rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-shadow placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full px-lg py-md bg-primary text-on-primary rounded-lg text-label-md font-label-md hover:bg-surface-tint transition-colors shadow-md mt-sm" type="submit">Sign In</button>
</form>
<p class="text-center text-body-md font-body-md text-on-surface-variant mt-lg">
        Don't have an account? <a class="text-primary font-label-md hover:text-primary-container transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
<div class="flex flex-col justify-center w-full p-container-padding bg-surface-container lg:w-1/2 lg:p-xl shadow-inner relative overflow-hidden">

<div class="w-full max-w-md mx-auto relative z-10 bg-surface-container-lowest p-lg rounded-xl shadow-xl">
<div class="flex items-center justify-between mb-xl">
<div>
<span class="inline-block px-sm py-xs bg-primary-container/10 text-primary rounded-full text-label-sm font-label-sm mb-xs">Step 1 of 3</span>
<h2 class="text-headline-md font-headline-md text-on-surface">Your Profile</h2>
</div>
<div class="flex gap-xs">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-high"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-high"></div>
</div>
</div>
<form class="flex flex-col gap-lg">
<div class="grid grid-cols-2 gap-md">
<div class="relative group">
<label class="block text-label-md font-label-md text-on-surface mb-xs flex items-center gap-xs" for="weight">
              Weight
              <span class="material-symbols-outlined text-[16px] text-on-surface-variant cursor-help">info</span>
<div class="absolute bottom-full left-0 mb-sm hidden group-hover:block w-48 p-sm bg-inverse-surface text-inverse-on-surface text-label-sm font-label-sm rounded-lg shadow-lg z-20">We use this to calculate your daily metabolic rate.</div>
</label>
<div class="relative">
<input class="w-full pl-md pr-xl py-md bg-surface text-on-surface rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-shadow" id="weight" placeholder="70" type="number"/>
<span class="absolute right-md top-1/2 -translate-y-1/2 text-body-md text-on-surface-variant">kg</span>
</div>
</div>
<div class="relative group">
<label class="block text-label-md font-label-md text-on-surface mb-xs flex items-center gap-xs" for="height">
              Height
              <span class="material-symbols-outlined text-[16px] text-on-surface-variant cursor-help">info</span>
<div class="absolute bottom-full left-0 mb-sm hidden group-hover:block w-48 p-sm bg-inverse-surface text-inverse-on-surface text-label-sm font-label-sm rounded-lg shadow-lg z-20">Needed for BMI and energy calculations.</div>
</label>
<div class="relative">
<input class="w-full pl-md pr-xl py-md bg-surface text-on-surface rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-shadow" id="height" placeholder="175" type="number"/>
<span class="absolute right-md top-1/2 -translate-y-1/2 text-body-md text-on-surface-variant">cm</span>
</div>
</div>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="age">Age</label>

</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="activity">Activity Level</label>

<option disabled="" selected="" value="">Select activity level</option>
<option value="sedentary">Sedentary (Little or no exercise)</option>
<option value="light">Lightly active (Light exercise/sports 1-3 days/week)</option>
<option value="moderate">Moderately active (Moderate exercise 3-5 days/week)</option>
<option value="active">Very active (Hard exercise 6-7 days/week)</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-sm">Primary Goal</label>
<div class="grid grid-cols-1 gap-sm">
<label class="relative flex items-center p-md bg-surface rounded-lg shadow-sm cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="goal" type="radio" value="lose"/>
<div class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary mr-md flex items-center justify-center transition-colors">
<div class="w-2 h-2 rounded-full bg-on-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<div class="flex flex-col">
<span class="text-label-md font-label-md text-on-surface">Lose Weight</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Create a caloric deficit</span>
</div>
</label>
<label class="relative flex items-center p-md bg-surface rounded-lg shadow-sm cursor-pointer hover:bg-surface-container-low transition-colors group">
<input checked="" class="peer sr-only" name="goal" type="radio" value="maintain"/>
<div class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary mr-md flex items-center justify-center transition-colors">
<div class="w-2 h-2 rounded-full bg-on-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<div class="flex flex-col">
<span class="text-label-md font-label-md text-on-surface">Maintain</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Optimize current weight</span>
</div>
</label>
<label class="relative flex items-center p-md bg-surface rounded-lg shadow-sm cursor-pointer hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="goal" type="radio" value="gain"/>
<div class="w-5 h-5 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary mr-md flex items-center justify-center transition-colors">
<div class="w-2 h-2 rounded-full bg-on-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<div class="flex flex-col">
<span class="text-label-md font-label-md text-on-surface">Gain Muscle</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Build strength and mass</span>
</div>
</label>
</div>
</div>
<button class="w-full px-lg py-md bg-primary text-on-primary rounded-lg text-label-md font-label-md hover:bg-surface-tint transition-colors shadow-md mt-sm flex items-center justify-center" type="button">
          Continue
          <span class="material-symbols-outlined ml-sm text-[20px]">arrow_forward</span>
</button>
</form>
</div>
</div>
</div></main></body></html>

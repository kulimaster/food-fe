<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginBtn = document.getElementById('loginBtn');
        const onboardingModal = document.getElementById('onboardingModal');
        const closeOnboardingBtn = document.getElementById('closeOnboardingBtn');

        // Simple animation to show modal
        loginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            // In a real app, handle auth first. Here we just show the next step.
            onboardingModal.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating transform
            setTimeout(() => {
                onboardingModal.classList.remove('translate-y-full');
            }, 10);
        });

        closeOnboardingBtn.addEventListener('click', () => {
            onboardingModal.classList.add('translate-y-full');
            setTimeout(() => {
                onboardingModal.classList.add('hidden');
            }, 500); // match transition duration
        });
    });

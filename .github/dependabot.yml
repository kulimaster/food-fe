version: 2
updates:
  - package-ecosystem: npm # also handles pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Must match the Node major in .nvmrc – bump both together by hand
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # One PR for all minor/patch updates; majors come separately so they get a proper look
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
